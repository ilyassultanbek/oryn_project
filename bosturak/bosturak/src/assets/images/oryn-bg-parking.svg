<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="y" cx="10%" cy="15%" r="45%">
      <stop offset="0" stop-color="#facc15" stop-opacity=".28"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p" cx="88%" cy="85%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="slots" width="90" height="180" patternUnits="userSpaceOnUse">
      <path d="M0 0 V70 M0 110 V180" stroke="#e3e3ea" stroke-width="3"/>
      <path d="M0 90 H90" stroke="#ececf1" stroke-width="2" stroke-dasharray="10 10"/>
    </pattern>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#dedee6"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#fafafa"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity=".7"/>
  <rect y="540" width="1600" height="360" fill="url(#slots)" opacity=".9"/>
  <rect width="1600" height="900" fill="url(#y)"/>
  <rect width="1600" height="900" fill="url(#p)"/>
  <!-- Бос орын белгісі -->
  <g transform="translate(225 720)" opacity=".5">
    <rect x="-34" y="-34" width="68" height="68" rx="14" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 6"/>
    <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#22c55e">P</text>
  </g>
</svg>
